[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agentgate"
version = "1.2.1"
description = "Layered operator screening and session-hijack resistance for AI-agent platforms (alpha)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["ai-agents", "security", "webauthn", "session-hijacking", "audit-log"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Typing :: Typed",
]
dependencies = ["cryptography>=42"]

[project.optional-dependencies]
geoip = ["geoip2"]

[project.scripts]
agent-gate = "agentgate.cli:main"

[tool.setuptools]
packages = ["agentgate"]

[tool.setuptools.package-data]
agentgate = ["data/*.json", "py.typed"]
